name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - name: Generate drift curve
        run: detector-resilience examples/features.csv --seed 7 --threshold 0.5 --thresholds 0.3,0.5,0.7 --strengths 0,0.5,1,1.5 --output resilience-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-resilience-report-${{ matrix.python-version }}
          path: resilience-report.json
