name: Test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q src/resilience_lab
      - name: Smoke-test installed CLI
        run: detector-resilience --help > /dev/null
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: detector-resilience --version
      - run: python -m unittest discover -s tests
      - name: Coverage snapshot
        run: |
          python -m pip install "coverage>=7.6"
          coverage run --source=src/resilience_lab -m unittest discover -s tests
          coverage report -m --fail-under=50
          coverage xml -o coverage.xml
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - name: Generate drift curve
        run: detector-resilience examples/features.csv --seed 7 --threshold 0.5 --thresholds 0.3,0.5,0.7 --strengths 0,0.5,1,1.5 --output resilience-report.json
      - name: Validate resilience-report schema
        run: python scripts/validate_json_schema.py schemas/resilience-report.schema.json resilience-report.json
      - name: Hash resilience report
        run: sha256sum resilience-report.json > resilience-report.json.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/detector-resilience --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-resilience-report-${{ matrix.python-version }}
          path: |
            resilience-report.json
            resilience-report.json.sha256
