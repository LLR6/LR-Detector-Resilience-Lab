[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-detector-resilience-lab"
version = "0.2.0"
description = "Safe feature-space experiments for measuring detector robustness under drift"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LLR6"}]
keywords = ["security", "ml-security", "feature-drift", "robustness", "reproducibility"]

[project.scripts]
detector-resilience = "resilience_lab.cli:main"

[project.urls]
Homepage = "https://github.com/LLR6/LR-Detector-Resilience-Lab"
Repository = "https://github.com/LLR6/LR-Detector-Resilience-Lab"
Issues = "https://github.com/LLR6/LR-Detector-Resilience-Lab/issues"

[tool.setuptools.packages.find]
where = ["src"]
